<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>氷のティータイム — セレス</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="title-screen" class="screen active">
      <div class="title-bg" aria-hidden="true"></div>
      <div class="title-content">
        <p class="title-sub">短いノベルゲーム</p>
        <h1 class="title-main">氷のティータイム</h1>
        <p class="title-char">feat. セレス</p>
        <button id="btn-start" class="btn-primary" type="button">はじめる</button>
        <p class="title-hint">タップ／クリックで進みます</p>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <div id="stage" class="stage">
        <img id="bg" class="bg" alt="" />
        <img id="sprite" class="sprite" alt="" />
        <div id="dialogue-box" class="dialogue-box">
          <div id="name-plate" class="name-plate">セレス</div>
          <p id="dialogue-text" class="dialogue-text"></p>
          <span id="continue-hint" class="continue-hint" aria-hidden="true">▼</span>
        </div>
        <div id="choices" class="choices hidden" role="group" aria-label="選択肢"></div>
      </div>
    </section>

    <section id="ending-screen" class="screen">
      <div class="ending-content">
        <p id="ending-label" class="ending-label"></p>
        <h2 id="ending-title" class="ending-title"></h2>
        <p id="ending-message" class="ending-message"></p>
        <button id="btn-retry" class="btn-primary" type="button">タイトルへ戻る</button>
      </div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>
